# Builds and runs the test suite on every pull request and every push to main,
# on the three systems Claude Code runs on.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compiled plugin matches src/
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- plugin/lib)" ]; then
            git status --short -- plugin/lib
            echo "plugin/lib is out of date: run npm run build and commit the result."
            exit 1
          fi
